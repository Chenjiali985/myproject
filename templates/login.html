{% extends 'base.html' %}

{% block content %}
<div class="auth-wrap">
  <form method="post" action="" class="card auth-card">
    <h1>登录后台</h1>
    <p class="muted">默认账号 admin / admin123（可用环境变量 ADMIN_USERNAME / ADMIN_PASSWORD 修改）</p>
    <label>用户名
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label>密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn full">登 录</button>
  </form>
</div>
{% endblock %}
